plugins {
    id 'java'
    id 'application'
}

group = 'projekt'
version = '1.2.0'

repositories {
    mavenCentral()
}

ext {
    junitVersion = '6.1.3'
    javafxVersion = '21.0.13'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Java 21 bytecode and API, whichever newer JDK runs the build.
    options.release = 21
}

// JavaFX loads its native libraries itself; newer JDKs warn unless this is allowed.
def nativeAccess = '--enable-native-access=javafx.graphics,javafx.media'

application {
    mainModule = 'projekt.yahtzee'
    mainClass = 'projekt.yahtzee.YahtzeeApplication'
    applicationDefaultJvmArgs = [nativeAccess]
}

// Detect platform for JavaFX classifier.
def osName = System.getProperty('os.name').toLowerCase()
def osArch = System.getProperty('os.arch').toLowerCase()
def javafxClassifier
if (osName.contains('win')) {
    javafxClassifier = 'win'
} else if (osName.contains('mac')) {
    javafxClassifier = osArch.contains('aarch64') ? 'mac-aarch64' : 'mac'
} else {
    javafxClassifier = osArch.contains('aarch64') ? 'linux-aarch64' : 'linux'
}

dependencies {
    implementation "org.openjfx:javafx-base:${javafxVersion}:${javafxClassifier}"
    implementation "org.openjfx:javafx-graphics:${javafxVersion}:${javafxClassifier}"
    implementation "org.openjfx:javafx-controls:${javafxVersion}:${javafxClassifier}"
    implementation "org.openjfx:javafx-fxml:${javafxVersion}:${javafxClassifier}"
    implementation "org.openjfx:javafx-media:${javafxVersion}:${javafxClassifier}"

    testImplementation("org.junit.jupiter:junit-jupiter-api:${junitVersion}")
    testImplementation("org.junit.jupiter:junit-jupiter-params:${junitVersion}")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:${junitVersion}")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}


test {
    useJUnitPlatform()
}

javadoc {
    options.encoding = 'UTF-8'
}

// Custom jlink task replacing the beryx jlink plugin.
tasks.register('jlink', Exec) {
    description = 'Creates a custom JDK runtime image with jlink'
    group = 'distribution'
    dependsOn 'jar'

    def imageDir = layout.buildDirectory.dir('jlink-image')
    outputs.dir(imageDir)

    doFirst {
        def imagePath = imageDir.get().asFile
        if (imagePath.exists()) {
            imagePath.deleteDir()
        }

        def modulePath = configurations.runtimeClasspath.files
                .collect { it.absolutePath }
                .join(File.pathSeparator)
        modulePath += File.pathSeparator + tasks.named('jar').get().archiveFile.get().asFile.absolutePath

        commandLine 'jlink',
                '--module-path', modulePath,
                '--add-modules', 'projekt.yahtzee',
                '--output', imagePath.absolutePath,
                '--strip-debug',
                '--compress', 'zip-9',
                '--no-header-files',
                '--no-man-pages',
                // jlink 21 needs the value as a separate argument; newer jlink refuses a separate
                // value that starts with "--". Leading with a -D property satisfies both.
                '--add-options', "-Dyahtzee.launcher=jlink ${nativeAccess}",
                '--launcher', 'app=projekt.yahtzee/projekt.yahtzee.YahtzeeApplication'
    }
}


// Zips the runtime image as build/distributions/app-<platform>.zip (app-win, app-linux,
// app-mac-aarch64, ...) for the Package and Release workflows. Unzip and start
// yahtzee/bin/app (app.bat on Windows); no separate JDK is needed.
tasks.register('jlinkZip', Zip) {
    description = 'Zips the jlink runtime image for distribution'
    group = 'distribution'
    dependsOn 'jlink'

    from(layout.buildDirectory.dir('jlink-image')) {
        into 'yahtzee'
    }
    archiveFileName = "app-${javafxClassifier}.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
}
