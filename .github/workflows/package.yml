name: Package (jlink)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  jlink:
    name: jlink Distribution (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # The runtime image is platform specific: each OS builds its own app-<platform>.zip.
      - name: Build jlink image and zip
        run: ./gradlew jlinkZip jar --no-daemon

      - name: Upload jlink ZIP
        uses: actions/upload-artifact@v7
        with:
          name: yahtzee-jlink-${{ runner.os }}
          path: build/distributions/app-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload JAR
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: yahtzee-jar
          path: build/libs/YAHTZEE-*.jar
          if-no-files-found: error
          retention-days: 30
