name: Release

on:
  push:
    tags: ['v*.*.*']

jobs:
  build:
    name: Build ${{ matrix.os }} runtime image
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build jlink image and zip
        run: ./gradlew jlinkZip --no-daemon

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ runner.os }}
          path: build/distributions/app-*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download the runtime images
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            LOG=$(git log --oneline)
          else
            LOG=$(git log ${PREV_TAG}..HEAD --oneline)
          fi
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$LOG"           >> $GITHUB_OUTPUT
          echo "EOF"            >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Yahtzee ${{ github.ref_name }}
          body: |
            Unzip the file for your system and start `yahtzee/bin/app` (`app.bat` on Windows).
            No separate Java install is needed.

            ## Changes
            ${{ steps.changelog.outputs.CHANGELOG }}
          files: dist/*.zip
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
